<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Fun JS - 20 Games</title>
<style>
    body { margin: 0; font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; }
    header { padding: 20px; font-size: 24px; font-weight: bold; background: #222; }
    .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 10px; }
    .menu button { background: #333; color: #fff; padding: 15px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .menu button:hover { background: #444; }
    .game { display: none; padding: 10px; }
    .active { display: block; }
    canvas { background: #000; display: block; margin: auto; }
    .back-btn { background: #e91e63; color: #fff; padding: 10px 20px; border: none; margin-top: 10px; font-size: 18px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<header>🎮 Big Fun JS - 20 Games 🎮</header>
<div id="menu" class="menu">
<button onclick="showGame(0)">Snake</button>
<button onclick="showGame(1)">Flappy Bird</button>
<button onclick="showGame(2)">2048</button>

<button onclick="showGame(8)">Simon Says</button>

<button onclick="showGame(15)">Maze Game</button>
<button onclick="showGame(16)">Word Scramble</button>
<button onclick="showGame(17)">Spin the Wheel</button>
<button onclick="showGame(18)">Number Guess</button>
<button onclick="showGame(19)">Keyboard Piano</button>

</div>

<div id="game0" class="game">

<script>
function showGame(i) {
    document.getElementById('menu').style.display = 'none';
    for (let j = 0; j < 20; j++) {
        document.getElementById('game' + j).classList.remove('active');
    }
    document.getElementById('game' + i).classList.add('active');
}

function backToMenu() {
    for (let j = 0; j < 20; j++) {
        document.getElementById('game' + j).classList.remove('active');
    }
    document.getElementById('menu').style.display = 'grid';
}

// Konami Code to unlock secret game
let konamiCode = [38,38,40,40,37,39,37,39,66,65];
let konamiIndex = 0;
document.addEventListener('keydown', function(e) {
    if (e.keyCode === konamiCode[konamiIndex]) {
        konamiIndex++;
        if (konamiIndex === konamiCode.length) {
            alert('🎉 Secret Game Unlocked! Coming Soon!');
            konamiIndex = 0;
        }
    } else {
        konamiIndex = 0;
    }
});
</script>
